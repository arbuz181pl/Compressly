# Verifies that the project compiles, passes its tests and is lint-clean.
# Produces a debug APK artifact but never signs or publishes anything.
name: Verify build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Compile release APK (unsigned)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      # abortOnError is enabled for CI via -PciLint, so lint problems fail this workflow.
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug -PciLint

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-unsigned
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore