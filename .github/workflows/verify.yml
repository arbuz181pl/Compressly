# Verifies that the project compiles, passes its tests and is lint-clean.
# Publishes the APK to a rolling GitHub release so it can be downloaded without
# a local build. Never signs anything.
name: Verify build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runners already provide the Android SDK, cmdline-tools and accepted
      # licences, so android-actions/setup-android is deliberately not used: it only adds a
      # moving part that can fail before the build even starts. AGP downloads any missing
      # platform or build-tools revision itself once the licences are accepted.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not available on this runner image"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      # Belt and braces: accept any outstanding licences so AGP can pull compileSdk 37.
      - name: Accept Android SDK licences
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Compile release APK (unsigned)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      # abortOnError is enabled for CI via -PciLint, so lint problems fail this workflow.
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug -PciLint

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Compressly-debug-${{ github.sha }}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Compressly-${{ github.sha }}-release-unsigned.apk"
          ls -lh dist

      # Attach the APKs to a rolling release tagged with the commit. Re-runs replace the
      # assets instead of failing, so a commit always has downloadable builds.
      - name: Publish rolling CI release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "CI build ${{ github.sha }}" \
              --notes "Automatic build of commit ${{ github.sha }}. Unsigned - see the Build & release workflow for signed artifacts."
          fi

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compressly-debug-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore